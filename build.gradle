plugins {
    id 'java'
}

group = 'com.adminsec'
version = '2.0.0'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.4'
    testImplementation 'net.portswigger.burp.extensions:montoya-api:2026.4'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.17.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

test {
    useJUnitPlatform()
}

jar {
    archiveBaseName = 'open-redirect-candidate-finder'
    manifest {
        attributes('Main-Class': 'com.adminsec.redirectfinder.RedirectFinderExtension')
    }
}
